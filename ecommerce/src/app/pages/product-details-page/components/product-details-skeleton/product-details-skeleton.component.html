<div class="skeleton-page">
  <!-- GALLERY -->
  <div class="skeleton-gallery">
    <div class="skeleton-thumbs">
      @for (i of items; track i) {
        <div class="skeleton-thumb shimmer"></div>
      }
    </div>
    <div class="skeleton-main-img shimmer"></div>
  </div>

  <!-- INFO -->
  <div class="skeleton-info">
    <div class="skeleton-brand shimmer"></div>
    <div class="skeleton-name shimmer"></div>
    <div class="skeleton-name short shimmer"></div>
    <div class="skeleton-rating shimmer"></div>

    <div class="skeleton-price shimmer"></div>

    <div class="skeleton-section">
      <div class="skeleton-label shimmer"></div>
      <div class="skeleton-colors">
        @for (i of colors; track i) {
          <div class="skeleton-color-dot shimmer"></div>
        }
      </div>
    </div>

    <div class="skeleton-section">
      <div class="skeleton-label shimmer"></div>
      <div class="skeleton-sizes">
        @for (i of sizes; track i) {
          <div class="skeleton-size shimmer"></div>
        }
      </div>
    </div>

    <div class="skeleton-btn shimmer"></div>
    <div class="skeleton-btn ghost shimmer"></div>

    <div class="skeleton-perks">
      @for (i of perks; track i) {
        <div class="skeleton-perk shimmer"></div>
      }
    </div>
  </div>
</div>
