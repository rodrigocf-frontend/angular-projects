<div class="gallery">
  <div class="thumbnails">
    @for (image of images(); track image.id) {
      <div class="thumb" [class.active]="currentBg()?.id === image.id">
        <div class="thumb-bg" style="background: linear-gradient(160deg, #e8e3dc, #d4cfc8)">
          <img [src]="currentBg()?.url" class="product-imgs" [alt]="image.alt" />
        </div>
      </div>
    }
  </div>
  <div class="main-img">
    <div class="main-bg" style="background: linear-gradient(160deg, #e8e3dc, #d4cfc8)">
      <img [src]="currentBg()?.url" class="product-imgs" [alt]="currentBg()?.alt" />
    </div>
    <div class="img-nav">
      <button (click)="onPreviousImage()">←</button>
      <button (click)="onNextImage()">→</button>
    </div>
  </div>
</div>
