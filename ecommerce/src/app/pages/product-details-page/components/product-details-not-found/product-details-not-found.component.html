<div class="not-found">
  <div class="not-found-inner">
    <p class="not-found-eyebrow">Erro 404</p>
    <h1 class="not-found-title">Produto não <em>encontrado</em></h1>
    <p class="not-found-desc">
      O produto que você está procurando não existe ou foi removido da nossa coleção.
    </p>
    <div class="not-found-actions">
      <button primary (click)="goToProducts()">Ver coleções</button>
      <button secondary (click)="goHome()">Voltar ao início</button>
    </div>
  </div>
</div>
