<div class="form-section">
  <h2 class="section-title">Forma de <em>pagamento</em></h2>

  <div class="payment-options">
    <div class="payment-opt selected">
      <div class="payment-radio"></div>
      <span class="payment-label">Cartão de crédito</span>
      <div class="payment-icons">
        <div class="payment-icon">VISA</div>
        <div class="payment-icon">MC</div>
        <div class="payment-icon">ELO</div>
      </div>
    </div>

    <div class="card-fields">
      <div class="field">
        <label class="label">Número do cartão <span class="req">*</span></label>
        <input class="input" type="text" placeholder="0000 0000 0000 0000" maxlength="19" />
      </div>
      <div class="field">
        <label class="label">Nome no cartão <span class="req">*</span></label>
        <input class="input" type="text" placeholder="Como aparece no cartão" />
      </div>
      <div class="form-grid">
        <div class="field">
          <label class="label">Validade <span class="req">*</span></label>
          <input class="input" type="text" placeholder="MM/AA" maxlength="5" />
        </div>
        <div class="field">
          <label class="label">CVV <span class="req">*</span></label>
          <input class="input" type="text" placeholder="000" maxlength="3" />
        </div>
      </div>
      <div class="field">
        <label class="label">Parcelas</label>
        <select class="input select">
          <option>1x de R$ 2.474,00 sem juros</option>
          <option>2x de R$ 1.237,00 sem juros</option>
          <option>3x de R$ 824,67 sem juros</option>
          <option>6x de R$ 412,33 sem juros</option>
          <option>12x de R$ 206,17 sem juros</option>
        </select>
      </div>
    </div>

    <div class="payment-opt">
      <div class="payment-radio"></div>
      <span class="payment-label">Pix</span>
      <div class="payment-icons">
        <div class="payment-icon" style="color: #32bcad; border-color: #32bcad">PIX</div>
      </div>
    </div>

    <div class="payment-opt">
      <div class="payment-radio"></div>
      <span class="payment-label">Boleto bancário</span>
      <div class="payment-icons">
        <div class="payment-icon">BOL</div>
      </div>
    </div>
  </div>
</div>
