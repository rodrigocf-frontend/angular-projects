<div class="form-section">
  <h2 class="section-title">Informações de <em>contato</em></h2>
  <div class="form-grid">
    <div class="field">
      <label class="label">Nome <span class="req">*</span></label>
      <input class="input" type="text" placeholder="Seu nome" />
    </div>
    <div class="field">
      <label class="label">Sobrenome <span class="req">*</span></label>
      <input class="input" type="text" placeholder="Seu sobrenome" />
    </div>
    <div class="field">
      <label class="label">E-mail <span class="req">*</span></label>
      <input class="input error" type="email" placeholder="seu@email.com" value="email-invalido" />
      <span class="error-msg">⚠ E-mail inválido</span>
    </div>
    <div class="field">
      <label class="label">Telefone <span class="req">*</span></label>
      <input class="input" type="tel" placeholder="(00) 00000-0000" />
    </div>
  </div>
</div>
