<div class="form-section">
  <h2 class="section-title">Endereço de <em>entrega</em></h2>
  <div class="form-grid">
    <div class="field full">
      <label class="label">CEP <span class="req">*</span></label>
      <input class="input" type="text" placeholder="00000-000" maxlength="9" />
    </div>
    <div class="field full">
      <label class="label">Endereço <span class="req">*</span></label>
      <input class="input" type="text" placeholder="Rua, Avenida..." />
    </div>
    <div class="field">
      <label class="label">Número <span class="req">*</span></label>
      <input class="input" type="text" placeholder="123" />
    </div>
    <div class="field">
      <label class="label">Complemento</label>
      <input class="input" type="text" placeholder="Apto, Bloco..." />
    </div>
    <div class="field">
      <label class="label">Bairro <span class="req">*</span></label>
      <input class="input" type="text" placeholder="Bairro" />
    </div>
    <div class="field">
      <label class="label">Cidade <span class="req">*</span></label>
      <input class="input" type="text" placeholder="Cidade" />
    </div>
    <div class="field">
      <label class="label">Estado <span class="req">*</span></label>
      <select class="input select">
        <option value="">Selecione</option>
        <option>SP</option>
        <option>RJ</option>
        <option>MG</option>
        <option>RS</option>
        <option>PR</option>
      </select>
    </div>
  </div>
</div>
