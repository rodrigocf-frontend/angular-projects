<div class="confirmation">
  <div class="confirmation-icon">✓</div>

  <p class="confirmation-eyebrow">Pedido realizado</p>
  <h2 class="confirmation-title">Pedido <em>confirmado</em></h2>
  <p class="confirmation-desc">
    Obrigada pela sua compra. Você receberá um e-mail com os detalhes e o rastreamento da entrega.
  </p>

  <div class="confirmation-order">#MSN-</div>

  <div class="confirmation-divider"></div>

  <div class="confirmation-summary">
    <div class="summary-row">
      <span class="summary-label">Entrega</span>
      <span class="summary-value">3 a 5 dias úteis</span>
    </div>
    <div class="summary-row">
      <span class="summary-label">Endereço</span>
      <span class="summary-value"></span>
    </div>
    <div class="summary-row">
      <span class="summary-label">Pagamento</span>
      <span class="summary-value">Cartão de crédito</span>
    </div>
    <div class="summary-row summary-total">
      <span class="summary-label">Total</span>
      <span class="summary-value">asfds</span>
    </div>
  </div>

  <div class="confirmation-actions">
    <a primary [routerLink]="['/product/all']">Continuar comprando</a>
    <a ghost [routerLink]="['/']">Voltar ao início</a>
  </div>
</div>
