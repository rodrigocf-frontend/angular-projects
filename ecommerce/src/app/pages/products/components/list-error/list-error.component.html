<div class="error-state">
  <div class="error-icon">
    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
      <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="1" />
      <path d="M24 14v12" stroke="currentColor" stroke-width="1" stroke-linecap="round" />
      <circle cx="24" cy="32" r="1" fill="currentColor" />
    </svg>
  </div>
  <h3 class="error-title">Algo deu <em>errado</em></h3>
  <p class="error-desc">
    Não foi possível carregar os produtos. Verifique sua conexão e tente novamente.
  </p>
  <button class="error-btn" (click)="retry.emit()">Tentar novamente</button>
</div>
