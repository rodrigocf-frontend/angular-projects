<div class="pagination">
  @for (page of pages(); track page) {
    @if (page === '...') {
      <span class="page-ellipsis">...</span>
    } @else {
      <button
        class="page-btn"
        [class.active]="page === this.pagination().current"
        (click)="goTo(page)"
      >
        {{ page }}
      </button>
    }
  }
</div>
