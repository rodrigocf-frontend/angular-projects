<app-breadcrumb />
<div class="page">
  <app-sidebar />
  <main class="main" id="products-list">
    <div class="main-header">
      <h1 class="main-title">Coleções <em>SS26</em></h1>
      <div class="main-meta">
        @if (productsPagination$ | async; as pagination) {
          <span class="results-count">{{ pagination.items }} peças</span>
        }
        <select class="sort-select" #sortSelect (change)="onSelectOrder(sortSelect.value)">
          @for (item of orderSelects; track item.label) {
            <option [value]="item.value">
              {{ item.label }}
            </option>
          }
        </select>
      </div>
    </div>
    <div class="active-filters">
      @if (filtersActives$ | async; as actives) {
        @for (item of actives; track $index) {
          <div class="active-filter">
            {{ item.name }} <button (click)="handleFilter(item)">×</button>
          </div>
        }
        @if (actives.length > 0) {
          <button class="clear-all" (click)="clearFilter()">Limpar tudo</button>
        }
      }
    </div>
    <app-products-list [orderedby]="orderedBy()" />
    @if (productsPagination$ | async; as pagination) {
      <app-pagination [pagination]="pagination" />
    }
  </main>
</div>
