<section class="hightlight-products-section">
  <app-section-header title="Destaque da" emphasys="semana" [link]="['/product/all']" />

  <div class="hightlight-products-grid">
    @for (item of data()?.data; track $index) {
      <a [routerLink]="['/product/details', item.id]">
        <article class="product-card">
          <div class="product-img">
            <div
              class="product-img-placeholder"
              [style]="{
                'background-image': 'url(' + item.images[0]?.url + ')',
              }"
            >
              <span>Produto</span>
            </div>
            @if (item.isNew) {
              <span class="product-badge badge-new">Novo</span>
            }
            <button class="product-wish">♡</button>
          </div>
          <p class="product-brand">{{ item.brand }}</p>
          <p class="product-name">{{ item.name }}</p>
          <div class="product-price">
            <span class="price-current">{{ item.price | currency: 'BRL' : 'symbol' }}</span>
          </div>
          <div class="product-colors">
            @for (color of getColors(item); track color.hex) {
              <div class="dot" [style.background]="color.hex" [title]="color.name"></div>
            }
          </div>
        </article>
      </a>
    }
  </div>
</section>
